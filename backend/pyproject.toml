[project]
name = "semantic-firewall-backend"
version = "0.1.0"
description = "Three-Headed Semantic Firewall — geometric prompt firewall exposed as an OpenAI v1 endpoint."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "lancedb==0.29.2",
    "sentence-transformers==5.3.0",
    "PyMuPDF==1.27.2",
    "psutil==7.2.2",
    "torch==2.10.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-multipart==0.0.22",
    "slowapi==0.1.9",
    "pandas>=3.0.3",
    "matplotlib>=3.11.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=1.0.0",
]

[project.optional-dependencies]
apple = [
    "simsimd>=6.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require production LanceDB and embedder (slow)",
]
filterwarnings = [
    # LanceDB / Apache Arrow SWIG internals — out of our control
    "ignore:builtin type Swig.*:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    # slowapi uses deprecated asyncio.iscoroutinefunction — fixed upstream, waiting for release
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
